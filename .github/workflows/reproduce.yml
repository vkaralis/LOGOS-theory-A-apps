name: Reproduce
on: [push, pull_request, workflow_dispatch]
jobs:
  python312:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked environment and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Unit and version checks
        run: python -m unittest discover -s tests -v
      - name: Reproduce and independently verify
        run: logos-reproduce --data data --output results
      - name: Rebuild inputs and repeat
        run: |
          logos-reproduce --generate-only --data generated-data
          logos-reproduce --data generated-data --output results-repeat
          python scripts/compare_runs.py results results-repeat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-results
          path: |
            results/
            results-repeat/
