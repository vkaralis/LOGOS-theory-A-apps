[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-theory-a-apps"
version = "0.5.0"
description = "LOGOS (Longitudinal Optimization of Global Outcomes and Strategies) — Bridging mathematical treatment theory and clinical evidence through PK/PD modeling and patient-level prediction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Vangelis D. Karalis"}]
keywords = ["logos", "pharmacokinetics", "pharmacodynamics", "pkpd", "dose-optimization", "dosing-regimens", "mathematical-modeling", "computational-pharmacology", "model-informed-precision-dosing", "treatment-optimization", "drug-safety"]
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.1", "matplotlib==3.10.9"]
classifiers = ["Programming Language :: Python :: 3.12", "Operating System :: OS Independent", "Topic :: Scientific/Engineering"]

[project.scripts]
logos-reproduce = "logos_apps.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
